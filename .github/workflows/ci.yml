name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: catalogs agree and pins exist upstream
        run: node scripts/check.mjs
